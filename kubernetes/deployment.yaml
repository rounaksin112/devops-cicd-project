apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: devops-app

  template:
    metadata:
      labels:
        app: devops-app

    spec:
      containers:
        - name: devops-app
          image: rounak123/devops-cicd-app:1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8081
